<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:ital,wght@1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --gold: #d4af37; --bg: #fffaf0; --text: #2c3e50; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; overflow-x: hidden; text-align: center; user-select: none; }
        canvas#petals { position: fixed; inset: 0; z-index: -1; }
        #lock { position: fixed; inset: 0; background: white; display: flex; align-items: center; justify-content: center; z-index: 10000; transition: 1s; }
        .lock-card { padding: 40px; border-radius: 30px; border: 2px solid var(--gold); width: 85%; max-width: 400px; box-shadow: 0 10px 40px rgba(212, 175, 55, 0.2); }
        .lock-card h1 { font-family: 'Amiri', serif; color: var(--gold); margin-bottom: 5px; font-size: 2.2em; }
        input, textarea { padding: 15px; border-radius: 12px; border: 1px solid #ccc; width: 85%; margin: 10px 0; text-align: center; font-size: 16px; outline: none; background: #fff; color: #000; font-family: 'Cairo'; }
        .gold-btn { padding: 15px 40px; border-radius: 50px; background: linear-gradient(45deg, #d4af37, #f2d472); color: white; border: none; cursor: pointer; font-weight: bold; font-size: 1.1em; transition: 0.3s; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4); }
        #content { display: none; opacity: 0; transition: 2s; padding: 20px; padding-bottom: 100px; }
        .main-photo { border: 10px solid white; border-bottom: 60px solid white; border-radius: 5px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); width: 90%; max-width: 400px; margin: 30px auto; position: relative; }
        .main-photo img { width: 100%; display: block; }
        .main-photo::after { content: 'Wedding Day'; position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-family: 'Amiri', serif; font-size: 1.5em; color: var(--gold); }
        .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 500px; margin: 30px auto; }
        .count-item { background: white; border: 1px solid var(--gold); padding: 15px 5px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .count-item b { display: block; font-size: 1.5em; color: var(--gold); }
        .count-item span { font-size: 0.7em; color: #777; }
        #typing-text { font-family: 'Amiri', serif; font-size: 1.6em; line-height: 1.8; color: #444; max-width: 600px; margin: 40px auto; min-height: 150px; white-space: pre-line; }
        .guestbook-section { margin-top: 50px; padding: 30px; background: white; border-radius: 25px; border: 1px solid var(--gold); max-width: 500px; margin: 40px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .heart-particle { position: absolute; pointer-events: none; animation: pop 0.8s ease-out forwards; color: var(--gold); z-index: 9999; }
        @keyframes pop { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1.5) translateY(-50px); opacity: 0; } }
    </style>
</head>
<body onclick="createHeart(event)">

    <canvas id="petals"></canvas>
    <div id="player" style="position: absolute; top: -9999px;"></div>

    <div id="lock">
        <div class="lock-card">
            <h1>17 May 2026</h1>

<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --gold: #d4af37; --bg: #fffaf0; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); font-family: 'Cairo', sans-serif; text-align: center; overflow-x: hidden; }
        
        /* شاشة القفل - مصلحة */
        #lock { position: fixed; inset: 0; background: white; display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .lock-card { padding: 30px; border: 2px solid var(--gold); border-radius: 20px; width: 90%; max-width: 350px; background: white; }
        .lock-card h1 { color: var(--gold); font-size: 1.8em; margin: 0; direction: ltr; }
        .lock-card p { color: #555; margin: 10px 0; font-size: 1.1em; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 10px; text-align: center; font-size: 18px; outline: none; }
        
        .gold-btn { background: linear-gradient(45deg, #d4af37, #f2d472); color: white; border: none; padding: 12px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1em; }

        /* المحتوى الرئيسي */
        #content { display: none; opacity: 0; transition: 1s; padding: 20px; }
        .main-photo { border: 10px solid white; border-bottom: 50px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 380px; margin: 20px auto; }
        .main-photo img { width: 100%; display: block; }
        
        .countdown { display: flex; justify-content: center; gap: 8px; margin: 20px auto; max-width: 400px; }
        .count-item { background: white; border: 1px solid var(--gold); padding: 10px; border-radius: 10px; flex: 1; }
        .count-item b { display: block; font-size: 1.2em; color: var(--gold); }
        .count-item span { font-size: 0.7em; color: #666; }

        #typing-text { font-family: 'Amiri', serif; font-size: 1.4em; line-height: 1.6; color: #333; margin: 30px auto; max-width: 500px; min-height: 100px; white-space: pre-line; direction: rtl; }

        .card-box { background: white; border: 1px solid var(--gold); border-radius: 20px; padding: 20px; margin: 20px auto; max-width: 500px; }
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 10px; padding: 10px; font-family: 'Cairo'; margin-bottom: 10px; }

        canvas#petals { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    </style>
</head>
<body>

    <canvas id="petals"></canvas>
    <div id="player" style="position: absolute; top: -9999px;"></div>

    <div id="lock">
        <div class="lock-card">
            <h1>17 May 2026</h1>
            <p>يوم الفرح المنتظر ❤️</p>
            <p style="color: var(--gold); font-size: 0.9em; font-weight: bold;">كلمة السر هي: 0000</p>
            <input type="number" id="pass" placeholder="ادخل الـ 4 أرقام...">
            <button class="gold-btn" onclick="unlock()">دخول ❤️</button>
        </div>
    </div>

    <div id="content">
        <h2 style="font-family: 'Amiri'; color: var(--gold); font-size: 2.2em; margin: 10px 0;">دعوة زفاف ❤️</h2>
        
        <div class="main-photo">
            <img src="body1.png" onerror="this.src='https://via.placeholder.com/400x600?text=Wedding+Day'">
        </div>

        <div class="countdown">
            <div class="count-item"><b id="d">00</b><span>أيام</span></div>
            <div class="count-item"><b id="h">00</b><span>ساعات</span></div>
            <div class="count-item"><b id="m">00</b><span>دقائق</span></div>
            <div class="count-item"><b id="s">00</b><span>ثواني</span></div>
        </div>

        <div id="typing-text"></div>

        <div class="card-box">
            <h3 style="color: var(--gold); margin-top: 0;">اكتبوا لنا كلمة حلوة ✨</h3>
            <textarea id="guest-msg" rows="3" placeholder="مباركتك هنا..."></textarea>
            <button class="gold-btn" style="width: auto;" onclick="sendWish()">إرسال ❤️</button>
        </div>

        <button class="gold-btn" style="width: auto; margin-top: 20px;" onclick="window.open('https://maps.app.goo.gl/fuwEqv7V82tMXYJh8', '_blank')">📍 موقع القاعة</button>
        
        <p style="margin-top: 40px; font-family: 'Amiri'; font-size: 1.5em; color: var(--gold);">دامت أيامكم بالأفراح ❤️</p>
    </div>

    <script>
        // الأغنية: سامو زين - لأنك معايا
        var player;
        var tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(tag);
        function onYouTubeIframeAPIReady() { player = new YT.Player('player', { height: '1', width: '1', videoId: 'OQqxrahyugs' }); }

        function unlock() {
            if(document.getElementById('pass').value === '0000') {
                if(player && player.playVideo) { player.unMute(); player.playVideo(); }
                confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
                document.getElementById('lock').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                setTimeout(() => { document.getElementById('content').style.opacity = '1'; startTyping(); }, 100);
            } else { alert("كلمة السر غلط! جرب 0000"); }
        }

        const msg = "نتشرف بدعوتكم بحضور يوم من أجمل أيام حياتنا..\nومعنى إنك وصلت هنا يبقى إنت شخص عزيز علينا ونحب نشركك أجمل أيام حياتنا.\nمستنيينكم تنورونا.. ❤️";
        function startTyping() {
            let i = 0; const el = document.getElementById('typing-text');
            function type() { if(i < msg.length) { el.innerHTML += msg.charAt(i); i++; setTimeout(type, 50); } }
            type();
        }

        // العداد
        const weddingDate = new Date("May 17, 2026 20:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime(); const diff = weddingDate - now;
            if(diff > 0) {
                document.getElementById("d").innerText = Math.floor(diff/86400000);
                document.getElementById("h").innerText = Math.floor((diff%86400000)/3600000);
                document.getElementById("m").innerText = Math.floor((diff%3600000)/60000);
                document.getElementById("s").innerText = Math.floor((diff%60000)/1000);
            }
        }, 1000);

        function sendWish() { confetti({ particleCount: 100 }); alert("شكراً على مباركتك الجميلة! ❤️"); document.getElementById('guest-msg').value = ''; }

        // بتلات الورد
        const canvas = document.getElementById('petals'); const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const petals = [];
        for(let i=0; i<25; i++) petals.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*4+2, v: Math.random()*1+0.5});
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "#ffb7c5";
            petals.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); p.y += p.v; if(p.y > canvas.height) p.y = -10; });
            requestAnimationFrame(draw);
        } draw();
    </script>
</body>
</html>
